name: Deploy VALIE Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://valie1.github.io
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          static_site_generator: next

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Audit static metadata routes
        run: npm run metadata:static:audit

      - name: Audit mobile viewport stability
        run: npm run mobile:viewport-stability:audit

      - name: Audit mobile software polish
        run: npm run mobile:software:audit

      - name: Audit mobile review auto + swipe
        run: npm run mobile:review-swipe:audit

      - name: Audit Cookie Settings legal round trip
        run: npm run legal:settings-roundtrip:audit

      - name: Audit mobile hero composition
        run: npm run mobile:hero-composition:audit

      - name: Audit mobile hero video play zone
        run: npm run mobile:hero-video-zone:audit

      - name: Type check
        run: npm run typecheck

      - name: Build GitHub Pages export
        run: npm run build:pages

      - name: Verify generated Pages export
        run: npm run github-pages:audit

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
